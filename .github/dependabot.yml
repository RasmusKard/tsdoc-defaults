version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Matches the oldest Node in `engines`; newer types would allow APIs it lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A runtime dependency: a new major is a deliberate upgrade, not a bump.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
