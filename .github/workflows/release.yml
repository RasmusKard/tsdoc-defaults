name: Release

# Merging release-please's PR creates a draft release with an attested tarball; a maintainer publishes it to npm with 2FA
# by running scripts/publish.sh X.Y.Z locally.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Holds the App key; limited to main.
    environment: release
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN would not trigger CI on the release PR.
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          # A cache written by other workflows could poison the release.
          package-manager-cache: false
      - run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: tsdoc-defaults-*.tgz

  # Holds the OIDC token, so it runs no repository or dependency code.
  attest:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
      - uses: actions/attest@v4.2.2
        with:
          subject-path: tsdoc-defaults-*.tgz
      - run: gh release upload "$TAG" tsdoc-defaults-*.tgz -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
